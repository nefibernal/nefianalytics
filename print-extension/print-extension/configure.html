<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set up print report</title><link rel="stylesheet" href="styles.css?v=0.1.3"><script src="vendor/tableau.extensions.js" defer></script><script src="core.js?v=0.1.3" defer></script><script src="configure.js?v=0.1.3" defer></script></head>
<body><main class="setup"><h1>Set up print report</h1><p class="hint">Version 0.1.3</p><p class="intro">Choose the table to print and the icon background color.</p><form id="setup">
<label for="worksheet">Table to print</label><select id="worksheet" required></select>

<label for="background">Background color</label><input id="background" type="color" value="#ffffff"><p class="hint">Click to open the native color picker. Screen-color selection depends on your Tableau Desktop or browser environment.</p>
<p id="error" class="error" role="alert"></p><div class="actions"><button type="button" id="cancel" class="secondary">Cancel</button><button id="save" class="primary" type="submit" disabled>Save</button></div>
</form></main></body></html>
