<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set up print report</title><link rel="stylesheet" href="ui.css?v=1.0.0"><script src="assets/tableau.extensions.js" defer></script><script src="data.js?v=1.0.0" defer></script><script src="setup.js?v=1.0.0" defer></script></head><body><main class="settings"><h1>Set up print report</h1><form id="settings-form">
<label for="table">Table to print</label><select id="table" required disabled><option value="">Loading tables…</option></select>
<label for="color">Background color</label><input id="color" type="color" value="#ffffff" aria-label="Background color">
<fieldset><legend>Report orientation</legend><label class="choice"><input type="radio" name="orientation" value="portrait" checked>Portrait</label><label class="choice"><input type="radio" name="orientation" value="landscape">Landscape</label></fieldset>
<p id="problem" class="error" role="alert"></p><div class="buttons"><button type="button" id="cancel">Cancel</button><button type="submit" id="save" class="primary" disabled>Save</button></div>
</form><p class="build">Print Report 1.0.0</p></main></body></html>
